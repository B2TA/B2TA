AWSTemplateFormatVersion: "2010-09-09"
Description: "Grading Assistant - S3 Bucket and publicly-accessible RDS PostgreSQL 18 (shared dev DB)"

Parameters:
  EnvironmentName:
    Type: String
    Default: rubric-grading-assistant
    Description: Environment name prefix for resource naming

  PublicSubnet1Id:
    Type: String
    Description: Public subnet 1 ID for the publicly-accessible RDS instance

  PublicSubnet2Id:
    Type: String
    Description: Public subnet 2 ID for the publicly-accessible RDS instance

  RdsSecurityGroupId:
    Type: String
    Description: Security group ID for RDS instance

  DBMasterUsername:
    Type: String
    Default: postgres
    Description: Master username for RDS

  DBMasterPassword:
    Type: String
    NoEcho: true
    Description: Master password for RDS
    MinLength: 8

Resources:
  # ---------- S3 Bucket ----------
  GradingFilesBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${EnvironmentName}-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-${AWS::AccountId}"

  # ---------- RDS PostgreSQL ----------
  DBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Subnet group for Grading Assistant RDS (public subnets)
      SubnetIds:
        - !Ref PublicSubnet1Id
        - !Ref PublicSubnet2Id
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-db-subnet-group"

  RDSInstance:
    Type: AWS::RDS::DBInstance
    Properties:
      DBInstanceIdentifier: !Sub "${EnvironmentName}-db"
      Engine: postgres
      EngineVersion: "18.4"
      DBInstanceClass: db.t3.micro
      AllocatedStorage: 20
      StorageType: gp3
      MultiAZ: false
      DBName: grading_assistant
      MasterUsername: !Ref DBMasterUsername
      MasterUserPassword: !Ref DBMasterPassword
      DBSubnetGroupName: !Ref DBSubnetGroup
      VPCSecurityGroups:
        - !Ref RdsSecurityGroupId
      BackupRetentionPeriod: 1
      PubliclyAccessible: true
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-rds"

Outputs:
  BucketName:
    Description: S3 bucket name for grading files
    Value: !Ref GradingFilesBucket
    Export:
      Name: !Sub "${EnvironmentName}-BucketName"

  BucketArn:
    Description: S3 bucket ARN
    Value: !GetAtt GradingFilesBucket.Arn
    Export:
      Name: !Sub "${EnvironmentName}-BucketArn"

  RDSEndpoint:
    Description: RDS instance endpoint address
    Value: !GetAtt RDSInstance.Endpoint.Address
    Export:
      Name: !Sub "${EnvironmentName}-RDSEndpoint"

  RDSPort:
    Description: RDS instance port
    Value: !GetAtt RDSInstance.Endpoint.Port
    Export:
      Name: !Sub "${EnvironmentName}-RDSPort"

  DBInstanceArn:
    Description: RDS instance ARN
    Value: !Sub "arn:aws:rds-db:${AWS::Region}:${AWS::AccountId}:dbuser:${RDSInstance.DbiResourceId}/${DBMasterUsername}"
    Export:
      Name: !Sub "${EnvironmentName}-DBInstanceArn"
