AWSTemplateFormatVersion: "2010-09-09"
Description: "Grading Assistant - Parent stack that nests all infrastructure components"

Parameters:
  EnvironmentName:
    Type: String
    Default: grading-assistant
    Description: Environment name prefix for resource naming

  TemplatesBucket:
    Type: String
    Description: S3 bucket containing nested CloudFormation templates

  DBMasterUsername:
    Type: String
    Default: gradingadmin
    Description: Master username for RDS PostgreSQL

  DBMasterPassword:
    Type: String
    NoEcho: true
    Description: Master password for RDS PostgreSQL
    MinLength: 8

  CertificateArn:
    Type: String
    Default: ""
    Description: ACM certificate ARN for HTTPS (leave empty for HTTP-only dev mode)

  CallbackUrl:
    Type: String
    Default: "https://localhost:3000"
    Description: OAuth callback URL for the frontend app

  ApiImage:
    Type: String
    Default: "public.ecr.aws/docker/library/eclipse-temurin:21-jre-alpine"
    Description: Docker image for API service

  WorkerImage:
    Type: String
    Default: "public.ecr.aws/docker/library/eclipse-temurin:21-jre-alpine"
    Description: Docker image for Worker service

Resources:
  # ---------- Network Stack ----------
  NetworkStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Sub "https://${TemplatesBucket}.s3.amazonaws.com/infra/network.yml"
      Parameters:
        EnvironmentName: !Ref EnvironmentName

  # ---------- Messaging Stack ----------
  MessagingStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Sub "https://${TemplatesBucket}.s3.amazonaws.com/infra/messaging.yml"
      Parameters:
        EnvironmentName: !Ref EnvironmentName

  # ---------- Security Stack (depends on Network + Messaging) ----------
  SecurityStack:
    Type: AWS::CloudFormation::Stack
    DependsOn:
      - NetworkStack
      - MessagingStack
    Properties:
      TemplateURL: !Sub "https://${TemplatesBucket}.s3.amazonaws.com/infra/security.yml"
      Parameters:
        EnvironmentName: !Ref EnvironmentName
        VpcId: !GetAtt NetworkStack.Outputs.VpcId
        BucketArn: !Sub "arn:aws:s3:::grading-assistant-files-${AWS::AccountId}-${AWS::Region}"
        JobQueueArn: !GetAtt MessagingStack.Outputs.JobQueueArn

  # ---------- Storage Stack (depends on Network + Security) ----------
  StorageStack:
    Type: AWS::CloudFormation::Stack
    DependsOn:
      - NetworkStack
      - SecurityStack
    Properties:
      TemplateURL: !Sub "https://${TemplatesBucket}.s3.amazonaws.com/infra/storage.yml"
      Parameters:
        EnvironmentName: !Ref EnvironmentName
        PrivateSubnet1Id: !GetAtt NetworkStack.Outputs.PrivateSubnet1Id
        PrivateSubnet2Id: !GetAtt NetworkStack.Outputs.PrivateSubnet2Id
        RdsSecurityGroupId: !GetAtt SecurityStack.Outputs.RdsSecurityGroupId
        DBMasterUsername: !Ref DBMasterUsername
        DBMasterPassword: !Ref DBMasterPassword

  # ---------- Auth Stack ----------
  AuthStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Sub "https://${TemplatesBucket}.s3.amazonaws.com/infra/auth.yml"
      Parameters:
        EnvironmentName: !Ref EnvironmentName
        CallbackUrl: !Ref CallbackUrl

  # ---------- Compute Stack (depends on all others) ----------
  ComputeStack:
    Type: AWS::CloudFormation::Stack
    DependsOn:
      - NetworkStack
      - SecurityStack
      - StorageStack
      - MessagingStack
    Properties:
      TemplateURL: !Sub "https://${TemplatesBucket}.s3.amazonaws.com/infra/compute.yml"
      Parameters:
        EnvironmentName: !Ref EnvironmentName
        VpcId: !GetAtt NetworkStack.Outputs.VpcId
        PublicSubnet1Id: !GetAtt NetworkStack.Outputs.PublicSubnet1Id
        PublicSubnet2Id: !GetAtt NetworkStack.Outputs.PublicSubnet2Id
        PrivateSubnet1Id: !GetAtt NetworkStack.Outputs.PrivateSubnet1Id
        PrivateSubnet2Id: !GetAtt NetworkStack.Outputs.PrivateSubnet2Id
        AlbSecurityGroupId: !GetAtt SecurityStack.Outputs.AlbSecurityGroupId
        EcsSecurityGroupId: !GetAtt SecurityStack.Outputs.EcsSecurityGroupId
        EcsExecutionRoleArn: !GetAtt SecurityStack.Outputs.EcsExecutionRoleArn
        ApiTaskRoleArn: !GetAtt SecurityStack.Outputs.ApiTaskRoleArn
        WorkerTaskRoleArn: !GetAtt SecurityStack.Outputs.WorkerTaskRoleArn
        ApiImage: !Ref ApiImage
        WorkerImage: !Ref WorkerImage
        CertificateArn: !Ref CertificateArn

Outputs:
  VpcId:
    Description: VPC ID
    Value: !GetAtt NetworkStack.Outputs.VpcId

  AlbDnsName:
    Description: Application Load Balancer DNS name
    Value: !GetAtt ComputeStack.Outputs.AlbDnsName

  RdsEndpoint:
    Description: RDS PostgreSQL endpoint
    Value: !GetAtt StorageStack.Outputs.RDSEndpoint

  S3BucketName:
    Description: S3 bucket for file storage
    Value: !GetAtt StorageStack.Outputs.BucketName

  SqsQueueUrl:
    Description: SQS job queue URL
    Value: !GetAtt MessagingStack.Outputs.JobQueueUrl

  CognitoUserPoolId:
    Description: Cognito User Pool ID
    Value: !GetAtt AuthStack.Outputs.UserPoolId

  CognitoClientId:
    Description: Cognito User Pool Client ID
    Value: !GetAtt AuthStack.Outputs.UserPoolClientId

  EcsClusterName:
    Description: ECS Cluster name
    Value: !GetAtt ComputeStack.Outputs.ClusterName
