AWSTemplateFormatVersion: "2010-09-09"
Description: "Grading Assistant - Security Groups and IAM Roles"

Parameters:
  EnvironmentName:
    Type: String
    Default: rubric-grading-assistant
    Description: Environment name prefix for resource naming

  VpcId:
    Type: String
    Description: VPC ID from network stack

  BucketArn:
    Type: String
    Default: ""
    Description: S3 bucket ARN (constructed from naming convention if not provided)

  JobQueueArn:
    Type: String
    Description: SQS job queue ARN from messaging stack

Resources:
  # ========== SECURITY GROUPS ==========

  # ---------- ALB Security Group ----------
  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for Application Load Balancer
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: "0.0.0.0/0"
          Description: HTTPS from internet
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: "0.0.0.0/0"
          Description: HTTP from internet (redirect to HTTPS)
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-alb-sg"

  # ---------- ECS Service Security Group ----------
  EcsSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for ECS Fargate tasks (API and Worker)
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          SourceSecurityGroupId: !Ref AlbSecurityGroup
          Description: Traffic from ALB on container port
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-ecs-sg"

  # ALB outbound to ECS
  AlbToEcsEgress:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !Ref AlbSecurityGroup
      IpProtocol: tcp
      FromPort: 8080
      ToPort: 8080
      DestinationSecurityGroupId: !Ref EcsSecurityGroup
      Description: ALB to ECS on container port

  # ECS outbound to RDS
  EcsToRdsEgress:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !Ref EcsSecurityGroup
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432
      DestinationSecurityGroupId: !Ref RdsSecurityGroup
      Description: ECS to RDS on PostgreSQL port

  # ECS outbound to HTTPS (S3 endpoints, Bedrock, SQS)
  EcsToHttpsEgress:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !Ref EcsSecurityGroup
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      CidrIp: "0.0.0.0/0"
      Description: ECS to AWS services (S3, SQS, Bedrock via HTTPS)

  # ---------- RDS Security Group ----------
  RdsSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for RDS PostgreSQL instance
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          CidrIp: "0.0.0.0/0"
          Description: PostgreSQL from anywhere (shared dev DB - matches hand-rolled SG)
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-rds-sg"

  # ========== IAM ROLES ==========

  # ---------- ECS Task Execution Role ----------
  EcsExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${EnvironmentName}-ecs-execution-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: "sts:AssumeRole"
      ManagedPolicyArns:
        - "arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy"
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-ecs-execution-role"

  # ---------- API Service Task Role ----------
  ApiTaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${EnvironmentName}-api-task-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: "sts:AssumeRole"
      Policies:
        - PolicyName: S3Access
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - "s3:PutObject"
                  - "s3:GetObject"
                  - "s3:DeleteObject"
                Resource:
                  - !Sub "${BucketArn}/uploads/*"
              - Effect: Allow
                Action:
                  - "s3:PutObject"
                Resource:
                  - !Sub "${BucketArn}/exports/*"
        - PolicyName: SqsSendMessage
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - "sqs:SendMessage"
                Resource: !Ref JobQueueArn
        - PolicyName: RdsIamAuth
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - "rds-db:connect"
                Resource:
                  - !Sub "arn:aws:rds-db:${AWS::Region}:${AWS::AccountId}:dbuser:*/${EnvironmentName}*"
        - PolicyName: BedrockCommentGeneration
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - "bedrock:InvokeModel"
                Resource:
                  - !Sub "arn:aws:bedrock:${AWS::Region}::foundation-model/anthropic.claude-haiku-*"
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-api-task-role"

  # ---------- Worker Service Task Role ----------
  WorkerTaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${EnvironmentName}-worker-task-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: "sts:AssumeRole"
      Policies:
        - PolicyName: S3ReadUploads
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - "s3:GetObject"
                Resource:
                  - !Sub "${BucketArn}/uploads/*"
        - PolicyName: SqsConsume
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - "sqs:ReceiveMessage"
                  - "sqs:DeleteMessage"
                  - "sqs:ChangeMessageVisibility"
                Resource: !Ref JobQueueArn
        - PolicyName: RdsIamAuth
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - "rds-db:connect"
                Resource:
                  - !Sub "arn:aws:rds-db:${AWS::Region}:${AWS::AccountId}:dbuser:*/${EnvironmentName}*"
        - PolicyName: BedrockAnalysis
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - "bedrock:InvokeModel"
                Resource:
                  - !Sub "arn:aws:bedrock:${AWS::Region}::foundation-model/anthropic.claude-sonnet-*"
                  - !Sub "arn:aws:bedrock:${AWS::Region}::foundation-model/anthropic.claude-haiku-*"
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-worker-task-role"

Outputs:
  AlbSecurityGroupId:
    Description: ALB Security Group ID
    Value: !Ref AlbSecurityGroup
    Export:
      Name: !Sub "${EnvironmentName}-AlbSecurityGroupId"

  EcsSecurityGroupId:
    Description: ECS Security Group ID
    Value: !Ref EcsSecurityGroup
    Export:
      Name: !Sub "${EnvironmentName}-EcsSecurityGroupId"

  RdsSecurityGroupId:
    Description: RDS Security Group ID
    Value: !Ref RdsSecurityGroup
    Export:
      Name: !Sub "${EnvironmentName}-RdsSecurityGroupId"

  EcsExecutionRoleArn:
    Description: ECS Task Execution Role ARN
    Value: !GetAtt EcsExecutionRole.Arn
    Export:
      Name: !Sub "${EnvironmentName}-EcsExecutionRoleArn"

  ApiTaskRoleArn:
    Description: API Service Task Role ARN
    Value: !GetAtt ApiTaskRole.Arn
    Export:
      Name: !Sub "${EnvironmentName}-ApiTaskRoleArn"

  WorkerTaskRoleArn:
    Description: Worker Service Task Role ARN
    Value: !GetAtt WorkerTaskRole.Arn
    Export:
      Name: !Sub "${EnvironmentName}-WorkerTaskRoleArn"
