AWSTemplateFormatVersion: "2010-09-09"
Description: "Grading Assistant - Cognito User Pool (self-signup, email+password direct auth)"

Parameters:
  EnvironmentName:
    Type: String
    Default: rubric-grading-assistant
    Description: Environment name prefix for resource naming

Resources:
  # ---------- Cognito User Pool ----------
  GradingUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Ref EnvironmentName
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: false  # Self-signup allowed (matches hand-rolled pool)
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: false
          TemporaryPasswordValidityDays: 7
      Schema:
        - Name: email
          AttributeDataType: String
          Required: true
          Mutable: true
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      UserPoolTags:
        Name: !Ref EnvironmentName

  # ---------- User Pool Client ----------
  # Direct-auth SPA client (no hosted UI / OAuth) to match the hand-rolled client.
  GradingUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub "${EnvironmentName}-web"
      UserPoolId: !Ref GradingUserPool
      GenerateSecret: false  # SPA client - no secret
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH

Outputs:
  UserPoolId:
    Description: Cognito User Pool ID
    Value: !Ref GradingUserPool
    Export:
      Name: !Sub "${EnvironmentName}-UserPoolId"

  UserPoolArn:
    Description: Cognito User Pool ARN
    Value: !GetAtt GradingUserPool.Arn
    Export:
      Name: !Sub "${EnvironmentName}-UserPoolArn"

  UserPoolClientId:
    Description: Cognito User Pool Client ID
    Value: !Ref GradingUserPoolClient
    Export:
      Name: !Sub "${EnvironmentName}-UserPoolClientId"
