AWSTemplateFormatVersion: "2010-09-09"
Description: "Grading Assistant - Cognito User Pool (admin-only account creation, email+password)"

Parameters:
  EnvironmentName:
    Type: String
    Default: grading-assistant
    Description: Environment name prefix for resource naming

  CallbackUrl:
    Type: String
    Default: "https://localhost:3000"
    Description: OAuth callback URL for the frontend app

Resources:
  # ---------- Cognito User Pool ----------
  GradingUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub "${EnvironmentName}-user-pool"
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true  # No self-signup
        InviteMessageTemplate:
          EmailSubject: "Your Grading Assistant account"
          EmailMessage: "Your administrator has created an account for you. Your temporary password is {####}. Please sign in and change your password."
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: false
          TemporaryPasswordValidityDays: 7
      Schema:
        - Name: email
          AttributeDataType: String
          Required: true
          Mutable: true
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      UserPoolTags:
        Name: !Sub "${EnvironmentName}-user-pool"

  # ---------- User Pool Client ----------
  GradingUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub "${EnvironmentName}-web-client"
      UserPoolId: !Ref GradingUserPool
      GenerateSecret: false  # SPA client - no secret
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      PreventUserExistenceErrors: ENABLED
      SupportedIdentityProviders:
        - COGNITO
      CallbackURLs:
        - !Ref CallbackUrl
      LogoutURLs:
        - !Ref CallbackUrl
      AllowedOAuthFlows:
        - code
      AllowedOAuthScopes:
        - email
        - openid
        - profile
      AllowedOAuthFlowsUserPoolClient: true
      AccessTokenValidity: 1  # 1 hour
      IdTokenValidity: 1  # 1 hour
      RefreshTokenValidity: 30  # 30 days
      TokenValidityUnits:
        AccessToken: hours
        IdToken: hours
        RefreshToken: days

  # ---------- User Pool Domain ----------
  GradingUserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Sub "${EnvironmentName}-${AWS::AccountId}"
      UserPoolId: !Ref GradingUserPool

Outputs:
  UserPoolId:
    Description: Cognito User Pool ID
    Value: !Ref GradingUserPool
    Export:
      Name: !Sub "${EnvironmentName}-UserPoolId"

  UserPoolArn:
    Description: Cognito User Pool ARN
    Value: !GetAtt GradingUserPool.Arn
    Export:
      Name: !Sub "${EnvironmentName}-UserPoolArn"

  UserPoolClientId:
    Description: Cognito User Pool Client ID
    Value: !Ref GradingUserPoolClient
    Export:
      Name: !Sub "${EnvironmentName}-UserPoolClientId"

  UserPoolDomain:
    Description: Cognito User Pool Domain
    Value: !Sub "${EnvironmentName}-${AWS::AccountId}"
    Export:
      Name: !Sub "${EnvironmentName}-UserPoolDomain"
