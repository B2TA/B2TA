AWSTemplateFormatVersion: "2010-09-09"
Description: "Grading Assistant - ECS Fargate Cluster, Task Definitions, ALB, Target Groups"

Parameters:
  EnvironmentName:
    Type: String
    Default: rubric-grading-assistant
    Description: Environment name prefix for resource naming

  VpcId:
    Type: String
    Description: VPC ID from network stack

  PublicSubnet1Id:
    Type: String
    Description: Public subnet 1 ID for ALB

  PublicSubnet2Id:
    Type: String
    Description: Public subnet 2 ID for ALB

  PrivateSubnet1Id:
    Type: String
    Description: Private subnet 1 ID for ECS tasks

  PrivateSubnet2Id:
    Type: String
    Description: Private subnet 2 ID for ECS tasks

  AlbSecurityGroupId:
    Type: String
    Description: ALB security group ID

  EcsSecurityGroupId:
    Type: String
    Description: ECS security group ID

  EcsExecutionRoleArn:
    Type: String
    Description: ECS task execution role ARN

  ApiTaskRoleArn:
    Type: String
    Description: API task role ARN

  WorkerTaskRoleArn:
    Type: String
    Description: Worker task role ARN

  ApiImage:
    Type: String
    Default: "public.ecr.aws/docker/library/eclipse-temurin:21-jre-alpine"
    Description: Docker image for API service (placeholder)

  WorkerImage:
    Type: String
    Default: "public.ecr.aws/docker/library/eclipse-temurin:21-jre-alpine"
    Description: Docker image for Worker service (placeholder)

  CertificateArn:
    Type: String
    Default: ""
    Description: ACM certificate ARN for HTTPS listener (leave empty for HTTP-only)

Conditions:
  HasCertificate: !Not [!Equals [!Ref CertificateArn, ""]]

Resources:
  # ---------- ECS Cluster ----------
  EcsCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub "${EnvironmentName}-cluster"
      CapacityProviders:
        - FARGATE
        - FARGATE_SPOT
      DefaultCapacityProviderStrategy:
        - CapacityProvider: FARGATE
          Weight: 1

      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-cluster"

  # ---------- API Task Definition ----------
  ApiTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub "${EnvironmentName}-api"
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      Cpu: "1024"  # 1 vCPU
      Memory: "2048"  # 2 GB
      ExecutionRoleArn: !Ref EcsExecutionRoleArn
      TaskRoleArn: !Ref ApiTaskRoleArn
      ContainerDefinitions:
        - Name: api
          Image: !Ref ApiImage
          Essential: true
          PortMappings:
            - ContainerPort: 8080
              Protocol: tcp
          Environment:
            - Name: SPRING_PROFILES_ACTIVE
              Value: api
            - Name: SERVER_PORT
              Value: "8080"

          HealthCheck:
            Command:
              - CMD-SHELL
              - "curl -f http://localhost:8080/actuator/health || exit 1"
            Interval: 30
            Timeout: 5
            Retries: 3
            StartPeriod: 60

  # ---------- Worker Task Definition ----------
  WorkerTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub "${EnvironmentName}-worker"
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      Cpu: "2048"  # 2 vCPU (heavier processing)
      Memory: "4096"  # 4 GB
      ExecutionRoleArn: !Ref EcsExecutionRoleArn
      TaskRoleArn: !Ref WorkerTaskRoleArn
      ContainerDefinitions:
        - Name: worker
          Image: !Ref WorkerImage
          Essential: true
          Environment:
            - Name: SPRING_PROFILES_ACTIVE
              Value: worker

          HealthCheck:
            Command:
              - CMD-SHELL
              - "curl -f http://localhost:8080/actuator/health || exit 1"
            Interval: 30
            Timeout: 5
            Retries: 3
            StartPeriod: 60

  # ---------- Application Load Balancer ----------
  ApplicationLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub "${EnvironmentName}-alb"
      Type: application
      Scheme: internet-facing
      Subnets:
        - !Ref PublicSubnet1Id
        - !Ref PublicSubnet2Id
      SecurityGroups:
        - !Ref AlbSecurityGroupId
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-alb"

  # ---------- Target Group ----------
  ApiTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub "${EnvironmentName}-api-tg"
      VpcId: !Ref VpcId
      Protocol: HTTP
      Port: 8080
      TargetType: ip
      HealthCheckEnabled: true
      HealthCheckPath: /actuator/health
      HealthCheckProtocol: HTTP
      HealthCheckPort: "8080"
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      DeregistrationDelay: 30
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-api-tg"

  # ---------- HTTPS Listener (conditional) ----------
  HttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Condition: HasCertificate
    Properties:
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Port: 443
      Protocol: HTTPS
      Certificates:
        - CertificateArn: !Ref CertificateArn
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref ApiTargetGroup

  # ---------- HTTP Listener (redirect to HTTPS or forward if no cert) ----------
  HttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - !If
          - HasCertificate
          - Type: redirect
            RedirectConfig:
              Protocol: HTTPS
              Port: "443"
              StatusCode: HTTP_301
          - Type: forward
            TargetGroupArn: !Ref ApiTargetGroup

  # ---------- API ECS Service ----------
  ApiService:
    Type: AWS::ECS::Service
    DependsOn:
      - HttpListener
    Properties:
      ServiceName: !Sub "${EnvironmentName}-api"
      Cluster: !Ref EcsCluster
      TaskDefinition: !Ref ApiTaskDefinition
      DesiredCount: 2
      LaunchType: FARGATE
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          Subnets:
            - !Ref PrivateSubnet1Id
            - !Ref PrivateSubnet2Id
          SecurityGroups:
            - !Ref EcsSecurityGroupId
      LoadBalancers:
        - ContainerName: api
          ContainerPort: 8080
          TargetGroupArn: !Ref ApiTargetGroup
      DeploymentConfiguration:
        MinimumHealthyPercent: 50
        MaximumPercent: 200
      HealthCheckGracePeriodSeconds: 90

  # ---------- Worker ECS Service (no ALB - SQS driven) ----------
  WorkerService:
    Type: AWS::ECS::Service
    Properties:
      ServiceName: !Sub "${EnvironmentName}-worker"
      Cluster: !Ref EcsCluster
      TaskDefinition: !Ref WorkerTaskDefinition
      DesiredCount: 1
      LaunchType: FARGATE
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          Subnets:
            - !Ref PrivateSubnet1Id
            - !Ref PrivateSubnet2Id
          SecurityGroups:
            - !Ref EcsSecurityGroupId
      DeploymentConfiguration:
        MinimumHealthyPercent: 0
        MaximumPercent: 200

Outputs:
  ClusterName:
    Description: ECS Cluster Name
    Value: !Ref EcsCluster
    Export:
      Name: !Sub "${EnvironmentName}-ClusterName"

  AlbDnsName:
    Description: ALB DNS Name
    Value: !GetAtt ApplicationLoadBalancer.DNSName
    Export:
      Name: !Sub "${EnvironmentName}-AlbDnsName"

  AlbHostedZoneId:
    Description: ALB Hosted Zone ID for Route53 alias records
    Value: !GetAtt ApplicationLoadBalancer.CanonicalHostedZoneID
    Export:
      Name: !Sub "${EnvironmentName}-AlbHostedZoneId"

  ApiServiceName:
    Description: API ECS Service Name
    Value: !GetAtt ApiService.Name
    Export:
      Name: !Sub "${EnvironmentName}-ApiServiceName"

  WorkerServiceName:
    Description: Worker ECS Service Name
    Value: !GetAtt WorkerService.Name
    Export:
      Name: !Sub "${EnvironmentName}-WorkerServiceName"
