spring:
  application:
    name: rubric-grading-assistant-worker
  profiles:
    active: worker

  datasource:
    url: jdbc:postgresql://localhost:5432/grading_assistant
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration

  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

# AWS Configuration
aws:
  region: ${AWS_REGION:us-east-1}
  s3:
    bucket: ${S3_BUCKET:rubric-grading-assistant}
  sqs:
    queue-url: ${SQS_QUEUE_URL:}
    wait-time-seconds: 20
    visibility-timeout-seconds: 300
  bedrock:
    region: ${BEDROCK_REGION:us-east-1}
    max-concurrent-invocations: 5
