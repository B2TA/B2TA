spring:
  application:
    name: rubric-grading-assistant-worker
  profiles:
    active: worker

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/grading_assistant}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    # The API applies migrations. The worker validates that what it finds matches, so a worker
    # deployed ahead of the API fails at startup instead of writing against an older schema.
    enabled: true
    locations: classpath:db/migration

  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

aws:
  region: ${AWS_REGION:us-east-1}
  s3:
    bucket: ${S3_BUCKET:}
    endpoint-override: ${S3_ENDPOINT_OVERRIDE:}
  sqs:
    queue-url: ${SQS_QUEUE_URL:}
    wait-time-seconds: 20
    visibility-timeout-seconds: 300
  bedrock:
    region: ${BEDROCK_REGION:${aws.region}}
    # The worker's IAM task role grants Sonnet for match analysis.
    match-model-id: ${BEDROCK_MATCH_MODEL:anthropic.claude-sonnet-4-20250514-v1:0}
    comment-model-id: ${BEDROCK_COMMENT_MODEL:anthropic.claude-haiku-4-5-20250401-v1:0}
    match-timeout-seconds: 30
    max-attempts: 4
    retry-base-delay-millis: 1000
    # Caps concurrent Bedrock invocations per worker instance so a 150-submission batch does not
    # turn account-level throttling into exhausted retries.
    max-concurrent-invocations: 5
    enabled: ${BEDROCK_ENABLED:true}
