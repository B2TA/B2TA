spring:
  application:
    name: rubric-grading-assistant-api
  profiles:
    active: api

  datasource:
    url: jdbc:postgresql://localhost:5432/grading_assistant
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration

  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

# AWS Configuration
aws:
  region: ${AWS_REGION:us-east-1}
  s3:
    bucket: ${S3_BUCKET:rubric-grading-assistant}
  sqs:
    queue-url: ${SQS_QUEUE_URL:}
  cognito:
    user-pool-id: ${COGNITO_USER_POOL_ID:}
    region: ${COGNITO_REGION:${aws.region}}

# Canvas LMS Integration
# Defaults to fixtures so a checkout runs without a Canvas token. Set
# CANVAS_DATA_SOURCE=canvas only once the live instance is confirmed healthy —
# never let a disconnected demo silently serve fixture data as if it were live.
canvas:
  data-source: ${CANVAS_DATA_SOURCE:fixtures}
  base-url: ${CANVAS_BASE_URL:}
  secret-id: ${CANVAS_SECRET_ID:b2ta/canvas}
  fixtures-path: ${CANVAS_FIXTURES_PATH:fixtures}
  course-id: ${CANVAS_COURSE_ID:1}
  per-page: 100

# Bedrock rubric analysis
# The us. inference-profile prefix is required — bare anthropic.* ids fail at
# invoke time. Raise the model once the account is granted a newer one.
analyze:
  enabled: ${ANALYZE_ENABLED:true}
  model-id: ${BEDROCK_MODEL_ID:us.anthropic.claude-sonnet-4-5-20250929-v1:0}
  max-tokens: 8000
  max-retries: 2
