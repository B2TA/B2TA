services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: b2ta
      POSTGRES_USER: b2ta
      POSTGRES_PASSWORD: b2ta
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U b2ta -d b2ta"]
      interval: 2s
      timeout: 5s
      retries: 10
    volumes:
      - b2ta-postgres:/var/lib/postgresql

volumes:
  b2ta-postgres:
